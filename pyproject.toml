[project]
name = "llm-scratch-lab"
version = "0.1.0"
description = "Extensible, educational LLM implementations and training experiments"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "datasets>=4.5.0",
    "protobuf>=6.33.5",
    "pydantic>=2.12.5",
    "schedulefree>=1.4.1",
    "sentencepiece>=0.2.1",
    "tokenizers>=0.22.2",
    "torch>=2.10.0",
    "transformers>=5.1.0",
]

[project.optional-dependencies]
tracking = [
    "python-dotenv>=1.1.0",
    "tensorboard>=2.20.0",
    "wandb>=0.25.0",
]

[project.scripts]
llm-lab = "llm_scratch_lab.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "ipykernel>=7.2.0",
    "pytest>=8.4.0",
    "ruff>=0.12.0",
    "setuptools<82",
]

[tool.hatch.build.targets.wheel]
packages = ["src/llm_scratch_lab"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu126", marker = "sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true
